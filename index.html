
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(120,120,255,.10), transparent 30%),
    linear-gradient(135deg, #08080c, #11111a 50%, #08080c);
  color: white;
}

.background {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: rgba(255,255,255,.035);
  filter: blur(80px);
}

.glow.one {
  top: -180px;
  left: -150px;
}

.glow.two {
  right: -180px;
  bottom: -180px;
}

.page-layout {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  width: 100%;
  max-width: 1400px;
  padding: 30px;
  margin: 0 auto;
}

.card {
  width: 100%;
  max-width: 1340px;
  padding: 55px 35px;
  text-align: center;
  background: rgba(20,20,28,.78);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 28px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.05);
  backdrop-filter: blur(20px);
}

.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  background: white;
  color: #111;
  font-size: 34px;
  font-weight: 900;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: -1px;
}

.subtitle {
  margin: 12px 0 32px;
  color: #a9a9b5;
  font-size: 16px;
  line-height: 1.5;
}

.main-button {
  width: 100%;
  max-width: 600px;
  padding: 18px 24px;
  border: none;
  border-radius: 15px;
  background: white;
  color: #111;
  font-size: 19px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.main-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(255,255,255,.16);
  background: #f0f0f0;
}

.main-button:active {
  transform: translateY(0) scale(.98);
}

.extension-button {
  display: block;
  width: 100%;
  max-width: 600px;
  margin: 12px auto 0;
  padding: 15px 24px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 15px;
  background: rgba(255,255,255,.06);
  color: white;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
}

.extension-button:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.11);
  border-color: rgba(255,255,255,.22);
  box-shadow: 0 10px 25px rgba(0,0,0,.25);
}

.extension-button:active {
  transform: translateY(0) scale(.98);
}

.status {
  margin-top: 18px;
  min-height: 20px;
  font-size: 13px;
  color: #aaaab5;
}

/* YouTube tutorial panel */
.video-card {
  width: 100%;
  max-width: 680px;
  padding: 22px;
  background: rgba(20,20,28,.78);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 24px;
  box-shadow:
    0 20px 50px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.05);
  backdrop-filter: blur(20px);
}

.video-title {
  margin: 0 0 16px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.5px;
  text-align: center;
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 14px;
  background: #08080c;
  border: 1px solid rgba(255,255,255,.10);
}

.video-frame iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

@media (max-width: 600px) {
  .page-layout {
    padding: 18px;
    gap: 22px;
  }

  .card {
    padding: 42px 24px;
  }

  h1 {
    font-size: 31px;
  }

  .logo {
    width: 68px;
    height: 68px;
    font-size: 29px;
  }

  .video-card {
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="page-layout">

  <!-- Main Roblox Followers menu -->
  <main class="card">

    <div class="logo">R</div>

    <h1>Roblox Followers</h1>

    <p class="subtitle">
      Grow your Roblox presence with one simple click.
    </p>

    <button class="main-button" id="main">
      Add Followers
    </button>

    <a
      class="extension-button"
      href="https://chromewebstore.google.com/detail/roblox-follower/mgdkcjifhnobklopbbjlgfmnpnndildf?authuser=0&amp;utm_source=app-launcher"
      target="_blank"
      rel="noopener noreferrer"
    >
      Extension
    </a>

    <div class="status" id="status" aria-live="polite"></div>

  </main>

  <!-- YouTube PC Tutorial -->
  <section class="video-card">
    <h2 class="video-title">PC Tutorial</h2>

    <div class="video-frame">
      <iframe
        src="https://www.youtube-nocookie.com/embed/pTrtwiEaet4"
        title="PC Tutorial"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>

</div>

<script>
const button = document.getElementById("main");
const status = document.getElementById("status");

button.addEventListener("click", () => {
  status.textContent =
    "Please use the official Roblox website and extension.";
});
</script>

</body>
</html>
